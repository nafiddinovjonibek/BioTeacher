{% extends "auth_base.html" %}
{% block title %}Parolni tiklash{% endblock %}
{% block auth_content %}
  <h1 class="font-semibold text-2xl text-slateg-900">Parolni tiklash</h1>
  <p class="mt-1 text-sm text-slateg-500">Email manzilingizni kiriting — tiklash havolasini yuboramiz.</p>
  <form method="post" class="mt-6">{% csrf_token %}
    <label class="block text-sm font-medium text-slateg-700 mb-1.5">Email</label>
    <input type="email" name="email" required class="field">
    <button class="mt-4 w-full btn btn-primary">Havola yuborish</button>
  </form>
{% endblock %}
