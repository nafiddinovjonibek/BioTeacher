<a href="{{ href }}"
   {% if active %}aria-current="page"{% endif %}{% if external %} target="_blank" rel="noopener"{% endif %}
   class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm font-medium
     {% if active %}bg-brand-600 text-white shadow-[0_6px_16px_-8px_rgba(23,132,63,.9)]{% else %}text-slateg-300 hover:bg-white/5 hover:text-white{% endif %}">
  <span class="shrink-0 w-[19px] h-[19px] grid place-items-center {% if not active %}text-brand-300{% endif %}">
    {% include "partials/icon.html" with name=icon %}
  </span>
  <span class="flex-1 min-w-0">
    <span class="rail-label block leading-snug">{{ label }}</span>
    {% if hint %}
      <span class="block mt-0.5 text-[11px] font-normal leading-tight {% if active %}text-white/75{% else %}text-slateg-500{% endif %}">{{ hint }}</span>
    {% endif %}
  </span>
  {% if badge %}
    <span class="shrink-0 grid place-items-center min-w-[20px] h-5 px-1.5 rounded-full text-xs font-bold
      {% if active %}bg-white/20 text-white{% else %}bg-brand-600 text-white{% endif %}">{{ badge }}</span>
  {% endif %}
</a>
